An ICU patient asks a completely exhausted intensivist, “Doctor, what happens when we die?”

<p>
The intensivist lets out a soul-crushing sigh, rubs his temple, and says:

<p>
“We clean the room, adjust the ventilator settings, and accept another transfer from the ED.”
